# CI for pull requests and pushes to main: the publish scripts' tests, then a plain production build (drafts hidden,
# as on main). Main's ruleset requires this job by its name, `test-and-build`, so keep the name stable.
# Why a plain build: Vercel's PR preview shows drafts, so only a build without them catches a page that breaks once
# its drafts are hidden. Without this check the first failing build would be production on main, which blocks every
# later deploy, the daily publish included. The publish bot's own pushes to main run it too; it has no effects.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # package.json names no packageManager, so the pnpm version is pinned here (same as publish.yml)
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # scripts/*.test.mjs: publish-due.mjs, the publish guard (check-publish-patch.py, needs python3, which the
      # runner has) and publish.yml's structure
      - run: pnpm test

      - run: pnpm build
